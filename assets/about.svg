<svg xmlns="http://www.w3.org/2000/svg" width="880" height="204" viewBox="0 0 880 204" role="img" aria-labelledby="title desc">
  <title id="title">Developer profile at a glance</title>
  <desc id="desc">Web development focus, design approach, engineering values, and education.</desc>
  <style>
    .bg{fill:#141c2b;stroke:#243049;stroke-width:1.5}
    .chipbg{fill:#1b2540}
    .icon{fill:none;stroke:#a5b4fc;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .label{font:700 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#2dd4bf;letter-spacing:1px}
    .val{font:400 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6ecf5}
    @media (prefers-color-scheme:light){
      .bg{fill:#f6f8fa;stroke:#d0d7de}
      .chipbg{fill:#fff;stroke:#d8dee4;stroke-width:1}
      .icon{stroke:#0969da}
      .label{fill:#0969da}
      .val{fill:#1f2328}
    }
  </style>
  <rect x="0" y="4" width="204" height="196" rx="16" class="bg"/>
  <rect x="18" y="22" width="44" height="44" rx="12" class="chipbg"/>
  <g class="icon" transform="translate(28 32)">
    <polyline points="6 4 1 12 6 20"/><polyline points="18 4 23 12 18 20"/><line x1="14" y1="2" x2="10" y2="22"/>
  </g>
  <text x="18" y="96" class="label">WHAT I BUILD</text>
  <text x="18" y="122" class="val">Business tools, school</text>
  <text x="18" y="144" class="val">platforms, and practical</text>
  <text x="18" y="166" class="val">web apps</text>
  <rect x="223" y="4" width="204" height="196" rx="16" class="bg"/>
  <rect x="241" y="22" width="44" height="44" rx="12" class="chipbg"/>
  <g class="icon" transform="translate(251 32)">
    <rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="7" y1="13" x2="12" y2="13"/><line x1="7" y1="17" x2="17" y2="17"/>
  </g>
  <text x="241" y="96" class="label">DESIGN FOCUS</text>
  <text x="241" y="122" class="val">Clean interfaces that</text>
  <text x="241" y="144" class="val">make everyday tasks</text>
  <text x="241" y="166" class="val">easier</text>
  <rect x="446" y="4" width="204" height="196" rx="16" class="bg"/>
  <rect x="464" y="22" width="44" height="44" rx="12" class="chipbg"/>
  <g class="icon" transform="translate(474 32)">
    <path d="M12 2 21 6v6c0 5-3.8 8.7-9 10-5.2-1.3-9-5-9-10V6z"/><polyline points="8 12 11 15 17 9"/>
  </g>
  <text x="464" y="96" class="label">MY APPROACH</text>
  <text x="464" y="122" class="val">Reliable, secure code</text>
  <text x="464" y="144" class="val">that stays easy to</text>
  <text x="464" y="166" class="val">maintain</text>
  <rect x="669" y="4" width="204" height="196" rx="16" class="bg"/>
  <rect x="687" y="22" width="44" height="44" rx="12" class="chipbg"/>
  <g class="icon" transform="translate(697 32)">
    <polygon points="12 3 23 9 12 15 1 9"/><path d="M5 11.2V17c3.8 3 10.2 3 14 0v-5.8"/><line x1="23" y1="9" x2="23" y2="16"/>
  </g>
  <text x="687" y="96" class="label">EDUCATION</text>
  <text x="687" y="122" class="val">BS Information</text>
  <text x="687" y="144" class="val">Technology</text>
  <text x="687" y="166" class="val">Universidad de Manila</text>
