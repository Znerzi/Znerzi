<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0E" />
      <stop offset="55%" stop-color="#241832" />
      <stop offset="100%" stop-color="#0B0B0E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6A1E" />
      <stop offset="50%" stop-color="#E8C45A" />
      <stop offset="100%" stop-color="#8A6A1E" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.4" fill="#E8C45A" fill-opacity="0.16" />
    </pattern>
  </defs>

  <rect width="900" height="220" fill="url(#bgGrad)" />
  <rect width="900" height="220" fill="url(#halftone)" />

  <!-- floating embers -->
  <g fill="#E8C45A">
    <circle cx="70" cy="180" r="2.4" opacity="0.8">
      <animate attributeName="cy" values="190;20;190" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="6.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="200" r="1.8" opacity="0.7">
      <animate attributeName="cy" values="205;30;205" dur="8s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="190" r="2.1" opacity="0.75">
      <animate attributeName="cy" values="200;25;200" dur="7.2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0" dur="7.2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="840" cy="170" r="1.6" opacity="0.6">
      <animate attributeName="cy" values="185;15;185" dur="9s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="205" r="2" opacity="0.7">
      <animate attributeName="cy" values="210;35;210" dur="7.8s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0" dur="7.8s" begin="1.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- gold rim rule -->
  <rect x="0" y="0" width="900" height="3" fill="url(#goldGrad)" opacity="0.85" />
  <rect x="0" y="217" width="900" height="3" fill="url(#goldGrad)" opacity="0.85" />

  <!-- name -->
  <text x="450" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">
    Renz Roann Diaz
  </text>

  <!-- subtitle -->
  <text x="450" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" fill="#D8CFC0" letter-spacing="1">
    Full-Stack Developer &#8226; Villain-Grade Code Only
  </text>

  <text x="450" y="178" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#8E86A6" letter-spacing="1">
    Laravel &#183; Vue.js &#183; Next.js &#183; TypeScript &#183; MySQL
  </text>

  <rect x="335" y="192" width="230" height="1" fill="#E8C45A" opacity="0.4" />
</svg>
