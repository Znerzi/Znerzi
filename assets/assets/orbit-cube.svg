<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D27A" />
      <stop offset="100%" stop-color="#C79A2E" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3574" />
      <stop offset="100%" stop-color="#2A1E45" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33244F" />
      <stop offset="100%" stop-color="#15101F" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C45A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E8C45A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="110" cy="112" r="95" fill="url(#glow)" />

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 110 112" to="360 110 112" dur="9s" repeatCount="indefinite" />

    <!-- top face -->
    <polygon points="110,42 165,72 110,102 55,72" fill="url(#topFace)" stroke="#0B0B0E" stroke-width="1.5" />
    <text x="110" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#241832">PHP</text>

    <!-- left face -->
    <polygon points="55,72 110,102 110,172 55,142" fill="url(#leftFace)" stroke="#0B0B0E" stroke-width="1.5" />
    <text x="82" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#E8C45A">VUE</text>

    <!-- right face -->
    <polygon points="165,72 110,102 110,172 165,142" fill="url(#rightFace)" stroke="#0B0B0E" stroke-width="1.5" />
    <text x="138" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#E8C45A">TS</text>
  </g>

  <text x="110" y="210" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8E86A6" letter-spacing="1">
    ROTATING STACK
  </text>
</svg>
