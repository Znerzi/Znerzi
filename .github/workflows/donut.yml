name: Generate Matrix Donut

on:
  push:
    paths:
      - ".github/workflows/donut.yml"
      - ".github/scripts/generate_donut.py"
  schedule:
    - cron: "17 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate Matrix donut GIF
        run: python .github/scripts/generate_donut.py
      - name: Commit generated GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Matrix donut"
          file_pattern: profile-banner.gif
